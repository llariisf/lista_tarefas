
<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Taskly | Minha Lista de Tarefas</title>

    <!-- daisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
        :root {
            --roxo: #8657c5;
            --roxo-claro: #f0e7ff;
            --texto: #352747;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f8f4ff, #eee5ff);
            color: var(--texto);
        }

        .topo {
            text-align: center;
            padding: 3rem 1rem 2rem;
        }

        .logo {
            color: var(--roxo);
            font-size: 1.2rem;
            font-weight: bold;
        }

        .topo h1 {
            font-size: clamp(2.5rem, 6vw, 3.5rem);
            margin: 0.7rem 0;
        }

        .topo p {
            color: #776786;
        }

        .painel {
            max-width: 650px;
            margin: 0 auto;
            border: 1px solid #e4d7f5;
            border-radius: 22px;
            background: white;
        }

        .btn-roxo {
            background: var(--roxo);
            border-color: var(--roxo);
            color: white;
        }

        .btn-roxo:hover {
            background: #7042ae;
            border-color: #7042ae;
        }

        .entrada {
            display: flex;
            gap: 0.6rem;
        }

        .entrada input {
            flex: 1;
            min-width: 0;
            background: white;
            border: 1px solid #d8c8eb;
            color: var(--texto);
        }

        .progresso-info {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            font-size: 0.9rem;
            margin: 1.5rem 0 0.5rem;
        }

        progress {
            width: 100%;
            height: 10px;
            accent-color: var(--roxo);
        }

        .tarefa {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.9rem 0;
            border-bottom: 1px solid #eee7f6;
        }

        .tarefa:last-child {
            border-bottom: none;
        }

        .tarefa .texto-tarefa {
            flex: 1;
            overflow-wrap: anywhere;
        }

        .tarefa.concluida .texto-tarefa {
            text-decoration: line-through;
            color: #95889f;
        }

        .tarefa input[type="checkbox"] {
            accent-color: var(--roxo);
            width: 1.15rem;
            height: 1.15rem;
            flex-shrink: 0;
        }

        .excluir {
            border: none;
            background: transparent;
            color: #bd5675;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0.3rem;
        }

        .excluir:hover {
            color: #8d2445;
        }

        .vazio {
            text-align: center;
            color: #95889f;
            padding: 2rem 0;
        }

        footer {
            text-align: center;
            padding: 2rem 1rem;
            color: #776786;
            font-size: 0.9rem;
        }

        @media (max-width: 480px) {
            .entrada {
                flex-direction: column;
            }

            .entrada button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header class="topo">
        <div class="logo">✿ TASKLY</div>
        <h1>Organize seu dia.</h1>
        <p>Pequenos passos também levam a grandes conquistas. 💜</p>
    </header>

    <main class="px-4 pb-8">

        <section class="card painel shadow-xl">
            <div class="card-body">

                <h2 class="card-title text-2xl">Minhas tarefas</h2>
                <p class="text-sm opacity-70">
                    O que você deseja realizar hoje?
                </p>

                <form id="form-tarefa" class="entrada">
                    <input
                        type="text"
                        id="nova-tarefa"
                        class="input"
                        placeholder="Ex.: estudar para a prova..."
                        maxlength="120"
                        autocomplete="off"
                        required
                    >

                    <button type="submit" class="btn btn-roxo">
                        + Adicionar
                    </button>
                </form>

                <div class="progresso-info">
                    <span>Seu progresso</span>
                    <span id="contador">0 de 0 concluídas</span>
                </div>

                <progress
                    id="barra-progresso"
                    class="progress"
                    value="0"
                    max="100"
                ></progress>

                <div class="flex flex-wrap gap-2 mt-5">
                    <button class="btn btn-sm btn-roxo filtro" data-filtro="todas">
                        Todas
                    </button>

                    <button class="btn btn-sm btn-outline filtro" data-filtro="pendentes">
                        Pendentes
                    </button>

                    <button class="btn btn-sm btn-outline filtro" data-filtro="concluidas">
                        Concluídas
                    </button>
                </div>

                <div id="lista-tarefas" class="mt-4"></div>

                <div id="mensagem-vazia" class="vazio">
                    <div class="text-4xl mb-2">📝</div>
                    <p>Nenhuma tarefa por aqui ainda!</p>
                    <p class="text-sm">Adicione sua primeira tarefa acima.</p>
                </div>

                <div class="flex justify-end mt-2">
                    <button id="limpar-concluidas" class="btn btn-ghost btn-sm">
                        Limpar concluídas
                    </button>
                </div>

            </div>
        </section>

    </main>

    <footer>
        <p>Um dia de cada vez, uma tarefa de cada vez. 💜</p>
    </footer>

    <script>
        const formulario = document.getElementById("form-tarefa");
        const entrada = document.getElementById("nova-tarefa");
        const lista = document.getElementById("lista-tarefas");
        const contador = document.getElementById("contador");
        const barra = document.getElementById("barra-progresso");
        const mensagemVazia = document.getElementById("mensagem-vazia");
        const limparConcluidas = document.getElementById("limpar-concluidas");
        const botoesFiltro = document.querySelectorAll(".filtro");

        let tarefas = [];
        let filtroAtual = "todas";

        function atualizarTela() {
            lista.replaceChildren();

            const tarefasVisiveis = tarefas.filter(tarefa => {
                if (filtroAtual === "pendentes") {
                    return !tarefa.concluida;
                }

                if (filtroAtual === "concluidas") {
                    return tarefa.concluida;
                }

                return true;
            });

            tarefasVisiveis.forEach(tarefa => {
                const item = document.createElement("div");
                item.className = "tarefa";

                if (tarefa.concluida) {
                    item.classList.add("concluida");
                }

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.checked = tarefa.concluida;
                checkbox.setAttribute(
                    "aria-label",
                    "Marcar tarefa como concluída"
                );

                checkbox.addEventListener("change", () => {
                    tarefa.concluida = checkbox.checked;
                    atualizarTela();
                });

                const texto = document.createElement("span");
                texto.className = "texto-tarefa";
                texto.textContent = tarefa.texto;

                const excluir = document.createElement("button");
                excluir.className = "excluir";
                excluir.textContent = "✕";
                excluir.setAttribute("aria-label", "Excluir tarefa");
                excluir.title = "Excluir tarefa";

                excluir.addEventListener("click", () => {
                    tarefas = tarefas.filter(item => item.id !== tarefa.id);
                    atualizarTela();
                });

                item.append(checkbox, texto, excluir);
                lista.appendChild(item);
            });

            const concluidas = tarefas.filter(tarefa => tarefa.concluida).length;

            contador.textContent = `${concluidas} de ${tarefas.length} concluídas`;

            barra.value = tarefas.length
                ? (concluidas / tarefas.length) * 100
                : 0;

            mensagemVazia.hidden = tarefasVisiveis.length > 0;

            if (tarefas.length === 0) {
                mensagemVazia.querySelector("p").textContent =
                    "Nenhuma tarefa por aqui ainda!";

                mensagemVazia.querySelectorAll("p")[1].textContent =
                    "Adicione sua primeira tarefa acima.";
            } else if (tarefasVisiveis.length === 0) {
                mensagemVazia.querySelector("p").textContent =
                    "Nenhuma tarefa nesta categoria.";

                mensagemVazia.querySelectorAll("p")[1].textContent =
                    "Experimente outro filtro.";
            }

            limparConcluidas.disabled = concluidas === 0;

            botoesFiltro.forEach(botao => {
                const ativo = botao.dataset.filtro === filtroAtual;

                botao.classList.toggle("btn-roxo", ativo);
                botao.classList.toggle("btn-outline", !ativo);
            });
        }

        formulario.addEventListener("submit", evento => {
            evento.preventDefault();

            const texto = entrada.value.trim();

            if (!texto) {
                entrada.focus();
                return;
            }

            tarefas.push({
                id: Date.now() + Math.random(),
                texto: texto,
                concluida: false
            });

            entrada.value = "";
            filtroAtual = "todas";
            atualizarTela();
            entrada.focus();
        });

        botoesFiltro.forEach(botao => {
            botao.addEventListener("click", () => {
                filtroAtual = botao.dataset.filtro;
                atualizarTela();
            });
        });

        limparConcluidas.addEventListener("click", () => {
            tarefas = tarefas.filter(tarefa => !tarefa.concluida);
            atualizarTela();
        });

        atualizarTela();
    </script>

</body>
</html>
